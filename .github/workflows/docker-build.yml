name: Build, Push Docker Image & Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./models-deployments/backend
          file: ./models-deployments/backend/Dockerfile
          push: true
          tags: |
            achinta005/fast_ml_server:latest
            achinta005/fast_ml_server:${{ github.sha }}

      - name: Trigger Deploy to Render
        if: success()
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "✅ Triggered Render deployment hook successfully!"
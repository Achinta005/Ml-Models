name: Build, Push Docker Image & Deploy to VM

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./models-deployments/backend
          file: ./models-deployments/backend/Dockerfile
          push: true
          tags: |
            achinta005/fast_ml_server:latest
            achinta005/fast_ml_server:${{ github.sha }}

      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /var/www/fastapi

            docker compose pull fastapi

            docker compose up -d --no-deps fastapi

            docker images achinta005/fast_ml_server --format "{{.ID}} {{.Tag}}" | \
              grep -v latest | \
              awk '{print $1}' | \
              xargs -r docker rmi -f

            docker image prune -f

            docker compose ps

            echo "✅ FastAPI ML Server deployed successfully!"
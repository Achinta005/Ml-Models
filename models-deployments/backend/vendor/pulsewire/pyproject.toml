[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsewire"
version = "0.1.0"
description = "Lightweight live log shipper — batches and streams application logs to a central collector server."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["logging", "logger", "telemetry", "log-shipper", "observability", "asyncio", "fastapi"]
dependencies = [
    "httpx>=0.24"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
include = ["pulsewire*"]

syntax = "proto3";

package polymind;

service PolyMindService {
  rpc IngestDocument (IngestRequest) returns (IngestResponse);
  rpc DeleteIndex    (DeleteRequest) returns (DeleteResponse);
  rpc QueryDocuments (QueryRequest)  returns (QueryResponse);
}

message IngestRequest {
  string doc_id        = 1;
  string download_url  = 2;
  string filename      = 3;
  string user_id       = 4;
  int64  size_bytes    = 5;
}

message IngestResponse {
  string doc_id  = 1;
  string status  = 2;
}

message DeleteRequest {
  string doc_id = 1;
}

message DeleteResponse {
  bool   deleted = 1;
  string doc_id  = 2;
}

message QueryRequest {
  string          question     = 1;
  repeated string document_ids = 2;
  string          user_id      = 3;
  int32           top_k        = 4;
}

message Citation {
  string doc_name = 1;
  int32  page     = 2;
  string chunk    = 3;
}

message QueryResponse {
  bool             success      = 1;
  string           answer       = 2;
  repeated Citation citations   = 3;
  string           error        = 4;
  string           messages_json = 5;  // add this — JSON-serialized prompt
}